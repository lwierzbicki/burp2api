# burp2api - Burp Suite REST API Extension Configuration
# This file contains default configuration settings for the extension

# API Server Configuration
api.port=7850
# Network interface to bind. Defaults to loopback so the API is not reachable
# from other machines. Set to 0.0.0.0 only together with api.token.
api.bind=127.0.0.1
# Optional bearer token. When set, every route except /health requires the
# header "Authorization: Bearer <token>". Empty means authentication is disabled.
api.token=

# Database Configuration
database.path=burp2api.db

# Logging Configuration
logging.verbose=false

# Session Configuration
session.tag= 